services:
  api:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [db, redis, minio]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securecampus
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: firstfinger/minio:latest-amd64
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  # Vista web minimalista para inspeccionar la base de datos durante las
  # pruebas (tablas, filas, ejecutar SELECT ad-hoc). No reemplaza a DBeaver
  # para trabajo serio, pero es suficiente para verificar el seed y el
  # resultado de cada prueba sin salir del navegador.
  adminer:
    image: adminer:4
    ports: ["8081:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  minio_data:
